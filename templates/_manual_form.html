<div class="card manual-card mb-4">
  <div class="card-body">
    <h2 class="h5">Elle kitap ekle</h2>
    <form method="post" action="{{ url_for('add_book') }}" class="row g-3">
      <div class="col-md-6"><label class="form-label">Kitap adı *</label><input class="form-control" name="title" required></div>
      <div class="col-md-6"><label class="form-label">Yazar</label><input class="form-control" name="author"></div>
      <div class="col-md-4"><label class="form-label">Yayınevi</label><input class="form-control" name="publisher"></div>
      <div class="col-md-4"><label class="form-label">Sayfa sayısı</label><input class="form-control" name="total_pages" type="number" min="1"></div>
      <div class="col-md-4"><label class="form-label">ISBN</label><input class="form-control" name="isbn"></div>
      <div class="col-md-4"><label class="form-label">Yayın yılı</label><input class="form-control" name="publication_year"></div>
      <div class="col-md-8 d-flex align-items-end gap-2">
        {% for shelf in ('Okunacak','Okunuyor','Okundu') %}
        <button class="btn btn-primary" name="shelf" value="{{ shelf }}">{{ shelf }}</button>
        {% endfor %}
      </div>
    </form>
  </div>
</div>
